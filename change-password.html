<!DOCTYPE html>
<html>

<head>
    <title>Change Password - Nur Hason</title>
</head>

<body>

    <h1>🔑 Change Password</h1>

    <label>Current Password:</label>
    <br>
    <input type="password" id="currentPassword">

    <br><br>

    <label>New Password:</label>
    <br>
    <input type="password" id="newPassword">

    <br><br>

    <label>Confirm New Password:</label>
    <br>
    <input type="password" id="confirmPassword">

    <br><br>

    <button onclick="changePassword()">Change Password</button>

    <p id="result"></p>

    <br>

    <button onclick="goHome()">🏠 Home</button>

    <script>

        function changePassword() {

            let currentPassword =
                document.getElementById("currentPassword").value;

            let newPassword =
                document.getElementById("newPassword").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let result =
                document.getElementById("result");

            if (currentPassword !== "1234") {
                result.innerText = "❌ Current password is incorrect.";
                return;
            }

            if (newPassword === "") {
                result.innerText = "❌ Enter a new password.";
                return;
            }

            if (newPassword !== confirmPassword) {
                result.innerText = "❌ New passwords do not match.";
                return;
            }

            result.innerText = "✅ Password changed successfully.";
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>

</html>

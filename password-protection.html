```html
<!DOCTYPE html>
<html>

<head>
    <title>Password Protection - Nur Hason</title>
</head>

<body>

    <h1>🔑 Password Protection</h1>

    <h3>Password Protection Settings</h3>

    <label>
        <input type="checkbox" id="protection">
        🔒 Enable Password Protection
    </label>

    <br><br>

    <label>
        Password:
        <br>
        <input type="password" id="password">
    </label>

    <br><br>

    <label>
        Confirm Password:
        <br>
        <input type="password" id="confirmPassword">
    </label>

    <br><br>

    <button type="button" id="saveButton">
        💾 Save Password Protection
    </button>

    <p id="result"></p>

    <hr>

    <button type="button" onclick="goBack()">
        ⬅️ Security
    </button>

    <button type="button" onclick="goHome()">
        🏠 Home
    </button>


    <script>

        function loadSettings() {

            let enabled =
                localStorage.getItem("passwordProtection");

            if (enabled === "true") {

                document.getElementById("protection").checked =
                    true;

            }

        }


        document.getElementById("saveButton")
            .addEventListener("click", function () {

                let enabled =
                    document.getElementById("protection").checked;

                let password =
                    document.getElementById("password").value;

                let confirmPassword =
                    document.getElementById("confirmPassword").value;

                let result =
                    document.getElementById("result");


                if (enabled === true) {

                    if (password === "") {

                        result.innerText =
                            "❌ Please enter a password.";

                        return;

                    }


                    if (password !== confirmPassword) {

                        result.innerText =
                            "❌ Passwords do not match.";

                        return;

                    }

                }


                localStorage.setItem(
                    "passwordProtection",
                    enabled
                );


                result.innerText =
                    enabled
                        ? "✅ Password protection settings saved."
                        : "✅ Password protection disabled.";


                document.getElementById("password").value = "";

                document.getElementById("confirmPassword").value = "";

            });


        function goBack() {

            window.location.href =
                "security.html";

        }


        function goHome() {

            window.location.href =
                "home.html";

        }


        window.onload = function () {

            loadSettings();

        };

    </script>

</body>

</html>
```
